version = 1
SPDX-PackageName = "kbake"
SPDX-PackageSupplier = "IronCore authors <ospo@sap.com>"
SPDX-PackageDownloadLocation = "https://github.com/ironcore-dev/kbake"

[[annotations]]
path = [
    ".github/**",
    ".gitignore",
    ".golangci.yml",
    "CODEOWNERS",
    "Makefile",
    "examples/**",
    "go.mod",
    "go.sum",
    "hack/**",
    "REUSE.toml"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["docs/**", "README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"
